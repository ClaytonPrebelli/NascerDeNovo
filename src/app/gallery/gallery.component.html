<section id="galeria" class="section gallery">
  <div class="container">
    <div class="gallery-header">
      <span class="section-tag">Nossas Missões</span>
      <h2 class="section-title">Nossas <span>Missões</span></h2>
      <p class="gallery-subtitle">
        Momentos que marcam nossa jornada missionária ao redor do mundo.
      </p>
    </div>
    <div class="gallery-grid">
      @for (img of images; track img.id; let i = $index) {
        <div
          class="gallery-item"
          [class.expanded]="expandedIndex === i"
          (click)="toggleExpanded(i)"
        >
          <img [src]="img.src" [alt]="img.alt" class="gallery-img" loading="lazy">
        </div>
      }
    </div>
    <div class="gallery-video">
      <video controls preload="metadata">
        <source [src]="videoSrc" type="video/mp4">
        Seu navegador não suporta vídeos.
      </video>
    </div>
  </div>
</section>
